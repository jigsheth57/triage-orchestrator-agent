server:
  address: 127.0.0.1
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
spring:
  application:
    name: triage-orchestrator-agent
  datasource:
    url: ${DEMO_DB_URL:jdbc:postgresql://127.0.0.1:55432/clinical_triage_demo}
    username: ${DEMO_DB_USER:clinical_demo}
    password: ${DEMO_DB_PASSWORD}
  flyway:
    locations: classpath:db/demo
  sql:
    init:
      mode: never
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      chat:
        options:
          model: ${DEMO_MODEL:qwen2.5:7b}
          temperature: 0.1
          num-predict: 350
          num-ctx: 16384
      embedding:
        enabled: false
demo:
  token-secret: ${DEMO_TOKEN_SECRET}
  login-password: ${DEMO_LOGIN_PASSWORD}
  model: ${DEMO_MODEL:qwen2.5:7b}
  mcp-url: ${DEMO_MCP_URL:http://127.0.0.1:8081}
  pharmacist-url: ${DEMO_PHARMACIST_URL:http://127.0.0.1:8082}
  guidance-url: ${DEMO_GUIDANCE_URL:http://127.0.0.1:8083}
  care-url: ${DEMO_CARE_URL:http://127.0.0.1:8084}
